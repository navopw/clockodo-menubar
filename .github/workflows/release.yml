name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          latest_tag="$({
            while IFS= read -r tag; do
              printf '%s' "$tag"
              break
            done < <(git tag --list 'v[0-9]*' --sort=-v:refname)
          })"

          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            major=0
            minor=0
            patch=0
          fi

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              printf 'Unsupported version bump: %s\n' "$BUMP" >&2
              exit 1
              ;;
          esac

          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Create release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Clockodo Menubar.app" \
            "release/Clockodo-Menubar-$VERSION.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "release/Clockodo-Menubar-$VERSION.zip" \
            --title "Clockodo Menubar $TAG" \
            --generate-notes
